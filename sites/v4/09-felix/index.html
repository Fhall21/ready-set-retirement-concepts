<!DOCTYPE html>
<html lang="en-AU" data-pal="a">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready Set Retirement &mdash; Dr San, psychosocial retirement education</title>
<meta name="description" content="Structure, identity, purpose, a sense of direction and connection all come with your work. Human-centred retirement planning with Dr San, Far North Queensland.">
<script>window.RSR_ROOT = "";</script>
<script>
(function(){try{
  var q=new URL(location.href).searchParams.get("pal");
  var p=(q||localStorage.getItem("rsr-pal")||"a").toLowerCase();
  if(p!=="b")p="a";
  document.documentElement.setAttribute("data-pal",p);
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/site.css">
<style>
/* Page-specific: every slot variant styles itself, scoped to [data-slot]. */
/* Pause -> dials seam: one experience. The pause line already says the lede, so dials
   drops it and its top padding; pause fades to dials' ground (GSAP on desktop, gradient on mobile). */
main:has([data-slot="pause"]:not(:empty)) [data-slot="dials"]>section{padding-top:0}
main:has([data-slot="pause"]:not(:empty)) [data-slot="dials"] :is(.s-d8-lede,.s-d7-lede){display:none}

/* Calmer, human type (Dr San, Oct 2026: against avant-garde type that pulls focus).
   Same family and sizes; the 800 display weight and tight tracking come down to 600 with a
   little more leading, so headings read like a person talking, not a poster. */
main [data-slot] :is(.s-hero-18__h1,.s-m2-h,.s-d8-h,.s-cover-7-h,.s-audience-4-h,.s-sp2-close,
  .s-consult-3 .copy h2,.s-practitioner-5 .bio h2){font-weight:600;letter-spacing:-.005em;line-height:1.15}
main [data-slot] :is(.s-sp2-lede,.s-d-close){font-weight:600}
main [data-slot] .s-practitioner-5 .pq .hl{font-weight:700}
</style>
</head>
<body>
<div id="site-nav"></div>

<main id="main">
  <div id="hero" data-slot="hero"></div>
  <div id="monday" data-slot="monday"></div>
  <div id="pause" data-slot="pause"></div>
  <div id="dials" data-slot="dials"></div>
  <div id="speech" data-slot="speech"></div>
  <div id="cover" data-slot="cover"></div>
  <div id="audience" data-slot="audience"></div>
  <div id="practitioner" data-slot="practitioner"></div>
  <div id="consult" data-slot="consult"></div>
</main>

<footer class="site-foot" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="shared/engine.js"></script>
</body>
</html>
