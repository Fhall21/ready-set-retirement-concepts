<section class="s-pause-2">
  <div class="s-pa2-stage">
    <div class="wrap s-pa2-in">
      <div class="s-pa2-rig">
        <span class="s-pa2-tag s-pa2-t-n">Direction</span>
        <span class="s-pa2-tag s-pa2-t-e">Identity</span>
        <span class="s-pa2-tag s-pa2-t-s">Purpose</span>
        <span class="s-pa2-tag s-pa2-t-w">Connection</span>
        <span class="s-pa2-work">Work</span>
      </div>
      <p class="s-pa2-line">Four things are attached to your work, and all four leave on the same afternoon.</p>
    </div>
  </div>
</section>
<style>
.s-pause-2{background:var(--ground)}
.s-pa2-stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-block:clamp(2.5rem,6vw,4rem)}
.s-pa2-in{width:100%;display:flex;flex-direction:column;align-items:center;gap:clamp(2.5rem,7vw,4.5rem)}
.s-pa2-rig{position:relative;width:min(78vw,420px);aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.s-pa2-work{font:800 clamp(1.6rem,5vw,2.6rem)/1 var(--sans);letter-spacing:-.02em;position:relative;z-index:2}
.s-pa2-tag{position:absolute;font:600 clamp(.85rem,2vw,1rem)/1 var(--sans);color:var(--ink-soft);
  background:var(--ground-2);border:1px solid var(--rule);border-radius:999px;padding:.5em 1em;white-space:nowrap}
.s-pa2-t-n{top:6%;left:50%;transform:translate(-50%,0)}
.s-pa2-t-e{right:2%;top:50%;transform:translate(0,-50%)}
.s-pa2-t-s{bottom:6%;left:50%;transform:translate(-50%,0)}
.s-pa2-t-w{left:2%;top:50%;transform:translate(0,-50%)}
.s-pa2-line{opacity:0;font:700 clamp(1.3rem,3.6vw,1.9rem)/1.4 var(--sans);max-width:26ch;text-align:center;letter-spacing:-.01em}
@media (max-width:640px){
  .s-pause-2{background:linear-gradient(var(--ground) 60%,var(--ground-2))}
  .s-pause-2 .s-pa2-stage{min-height:auto;padding-block:3.5rem 2rem}
  .s-pa2-rig{width:min(84vw,320px)}
}
</style>
<script>
window.slotInit["pause"] = function(root, reduced){
  var n = root.querySelector(".s-pa2-t-n"), e = root.querySelector(".s-pa2-t-e"),
      s = root.querySelector(".s-pa2-t-s"), w = root.querySelector(".s-pa2-t-w");
  var tags = [n, e, s, w];
  var line = root.querySelector(".s-pa2-line");

  if(reduced){
    gsap.set(tags, {opacity:0});
    gsap.set(line, {opacity:1});
    return;
  }

  var mm = gsap.matchMedia();

  var sec = root.querySelector(".s-pause-2"), work = root.querySelector(".s-pa2-work"),
      toGround = getComputedStyle(document.documentElement).getPropertyValue("--ground-2").trim();

  mm.add("(min-width: 641px)", function(){
    var tl = gsap.timeline({
      scrollTrigger: { trigger: root, start:"top top", end:"+=100%", scrub:.7, pin:true, invalidateOnRefresh:true }
    });
    // held, attached, until one synchronized moment: all four leave together
    tl.to(n, {y:"-140%", opacity:0, ease:"none"}, .45);
    tl.to(e, {x:"140%", opacity:0, ease:"none"}, .45);
    tl.to(s, {y:"140%", opacity:0, ease:"none"}, .45);
    tl.to(w, {x:"-140%", opacity:0, ease:"none"}, .45);
    tl.to(line, {opacity:1, ease:"none"}, .68);
    // hand-off: the empty centre dims, the room takes on the report's ground, and the
    // line lifts toward the results that follow, so pause and dials read as one scene
    tl.to(work, {opacity:.18, scale:.92, ease:"none"}, .6);
    tl.to(sec, {backgroundColor:toGround, ease:"none"}, .72);
    tl.to(line, {y:"-12vh", ease:"none"}, .8);
    tl.to(root.querySelector(".s-pa2-rig"), {y:"-12vh", opacity:.5, ease:"none"}, .8);
    return function(){};
  });

  mm.add("(max-width: 640px)", function(){
    var tl = gsap.timeline({
      scrollTrigger: { trigger: root, start:"top 70%", end:"bottom 40%", scrub:.6 }
    });
    tl.to(tags, {opacity:0, scale:.6, ease:"none"}, .45);
    tl.to(line, {opacity:1, ease:"none"}, .68);
    return function(){};
  });
};
</script>
