<section class="s-thread-1" aria-hidden="true">
  <svg class="s-thread-1__svg" preserveAspectRatio="none" focusable="false">
    <defs>
      <linearGradient id="s-thread-1-grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--brand)"/>
        <stop offset="1" stop-color="var(--accent-bright)"/>
      </linearGradient>
    </defs>
    <path class="s-thread-1__path" d=""/>
  </svg>
  <div class="s-thread-1__edge"></div>
</section>

<style>
/* .s-thread-1 sits in the [data-slot="thread"] div, which is a sibling AFTER </main>
   in index.html — it is not inside main, so it is positioned to overlay main via
   fixed coordinates measured from the document, not relative percentages. */
.s-thread-1{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:visible}
.s-thread-1__svg{position:absolute;top:0;left:0;width:100%;pointer-events:none}
.s-thread-1__path{
  fill:none;
  stroke:url(#s-thread-1-grad);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  vector-effect:non-scaling-stroke;
}
.s-thread-1__edge{display:none}

/* Phones: full winding line reads as noise in a 16px gutter. Collapse to a
   thin right-edge scroll-progress line instead; the SVG path is hidden. */
@media (max-width:700px){
  .s-thread-1__svg{display:none}
  .s-thread-1__edge{
    display:block;position:fixed;top:0;right:0;width:3px;height:100%;
    background:color-mix(in srgb, var(--ink) 8%, transparent);
  }
  .s-thread-1__edge::after{
    content:"";position:absolute;left:0;top:0;width:100%;height:var(--thread-p,0%);
    background:linear-gradient(to bottom, var(--brand), var(--accent-bright));
  }
}
</style>
<script>
window.slotInit["thread"] = function(root, reduced){
  var svg  = root.querySelector(".s-thread-1__svg");
  var path = root.querySelector(".s-thread-1__path");
  var edge = root.querySelector(".s-thread-1__edge");
  var main = document.getElementById("main");
  var length = 0;
  var isPhone = function(){ return window.innerWidth < 700; };

  function docHeight(){
    var b = document.body, d = document.documentElement;
    return Math.max(b.scrollHeight, b.offsetHeight, d.scrollHeight, d.offsetHeight);
  }

  // Gentle S-curve control points around a base x, biased left/right by dir.
  function weave(x0, y0, x1, y1, dir, swing){
    var dy = y1 - y0;
    var cx1 = x0 + swing * dir, cy1 = y0 + dy * 0.33;
    var cx2 = x1 - swing * dir, cy2 = y1 - dy * 0.33;
    return "C " + cx1.toFixed(1) + " " + cy1.toFixed(1) + ", " +
                  cx2.toFixed(1) + " " + cy2.toFixed(1) + ", " +
                  x1.toFixed(1) + " " + y1.toFixed(1) + " ";
  }

  function buildPath(){
    if (isPhone() || !main) return;
    var h = docHeight();
    if (!h) return;
    var mw = main.getBoundingClientRect().width || window.innerWidth;
    var gut = Math.max(20, Math.min(56, mw * 0.045)); // hug the left margin
    var swing = Math.min(30, gut * 1.4);

    svg.setAttribute("width", window.innerWidth);
    svg.setAttribute("height", h);
    svg.setAttribute("viewBox", "0 0 " + window.innerWidth + " " + h);
    svg.style.height = h + "px";

    // Anchors: each h2 / section heading position, so the line passes close
    // to every section's title as it winds down the page margin.
    var heads = Array.prototype.slice.call(main.querySelectorAll("h2"));
    if (!heads.length) heads = Array.prototype.slice.call(main.querySelectorAll("[data-slot] section"));
    var anchors = heads.map(function(el){
      var r = el.getBoundingClientRect();
      return Math.round(r.top + window.scrollY);
    }).filter(function(y, i, a){ return i === 0 || y - a[i-1] > 60; });

    var x = gut;
    var d = "M " + x + " 0 ";
    var cursor = 0;
    var dir = 1;
    for (var i = 0; i < anchors.length; i++){
      var y = anchors[i];
      if (y <= cursor + 20) continue;
      d += weave(x, cursor, x, y, dir, swing);
      cursor = y;
      dir *= -1;
    }
    d += weave(x, cursor, x, h - 4, dir, swing * 0.7);

    path.setAttribute("d", d);
    length = path.getTotalLength();
    path.style.strokeDasharray = length + " " + length;
    path.style.strokeDashoffset = reduced ? 0 : length;
  }

  var draw = { p: reduced ? 1 : 0 };
  function paintFull(){
    if (length) path.style.strokeDashoffset = length * (1 - draw.p);
  }
  function paintEdge(pct){
    root.style.setProperty("--thread-p", (pct * 100).toFixed(1) + "%");
  }

  buildPath();

  if (reduced){
    paintFull();
    paintEdge(1);
    return;
  }

  var st = ScrollTrigger.create({
    trigger: document.documentElement,
    start: "top top",
    end: "bottom bottom",
    scrub: 0.8,
    invalidateOnRefresh: true,
    onRefresh: buildPath,
    onUpdate: function(self){
      draw.p = self.progress;
      paintFull();
      paintEdge(self.progress);
    }
  });

  // Rebuild whenever another slot swaps in/out (heading positions move) or
  // the viewport crosses the phone breakpoint. gsap.context (created by the
  // slot loader around this init call) auto-reverts the ScrollTrigger above
  // on the next swap, but a plain document listener would otherwise leak —
  // so it's registered on root-scoped state and explicitly removed via
  // ctx.add's cleanup hook (the recommended gsap.context pattern for
  // non-GSAP side effects).
  var onChange = function(){ ScrollTrigger.refresh(); };
  document.addEventListener("vitals:change", onChange);
  gsap.context(function(){
    return function(){ document.removeEventListener("vitals:change", onChange); };
  }, root);
};
</script>
