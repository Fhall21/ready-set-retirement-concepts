<section class="s-dials-5">
  <div class="wrap s-d5-in">
    <div class="s-d5-head">
      <h2 class="s-d5-h">Four things leave on the same afternoon.</h2>
      <p class="s-d5-lede">They were all attached to the job. Preparation is what puts them back.</p>
    </div>

    <div class="s-d5-bankwrap">
      <div class="s-d5-sweepband" id="s-d5-sweepband" aria-hidden="true"></div>
      <div class="s-d5-bank" id="s-d5-bank">
        <button type="button" class="s-d5-dial" data-off="24" data-on="82" aria-pressed="false">
          <svg viewBox="0 0 140 140" aria-hidden="true">
            <path class="s-d5-track" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <g class="s-d5-ticks" stroke-linecap="round">
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-132 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-66 70 70)"></line>
              <line x1="70" y1="16" x2="70" y2="28" transform="rotate(0 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(66 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(132 70 70)"></line>
            </g>
            <path class="s-d5-arc" pathLength="100" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <line class="s-d5-needle" x1="70" y1="70" x2="70" y2="24"></line>
            <circle class="s-d5-hub" cx="70" cy="70" r="5"></circle>
          </svg>
          <p class="s-d5-read"><b>Direction</b><span data-num>0</span></p>
          <p class="s-d5-copy" data-off-txt="Forty years of somewhere to be, finished on a Friday." data-on-txt="A weekday shape you chose, in place before the date.">Forty years of somewhere to be, finished on a Friday.</p>
        </button>
        <button type="button" class="s-d5-dial" data-off="19" data-on="78" aria-pressed="false">
          <svg viewBox="0 0 140 140" aria-hidden="true">
            <path class="s-d5-track" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <g class="s-d5-ticks" stroke-linecap="round">
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-132 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-66 70 70)"></line>
              <line x1="70" y1="16" x2="70" y2="28" transform="rotate(0 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(66 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(132 70 70)"></line>
            </g>
            <path class="s-d5-arc" pathLength="100" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <line class="s-d5-needle" x1="70" y1="70" x2="70" y2="24"></line>
            <circle class="s-d5-hub" cx="70" cy="70" r="5"></circle>
          </svg>
          <p class="s-d5-read"><b>Identity</b><span data-num>0</span></p>
          <p class="s-d5-copy" data-off-txt="Introduced by your job title for thirty years. Then not." data-on-txt="An answer to what you do that is yours, not the firm's.">Introduced by your job title for thirty years. Then not.</p>
        </button>
        <button type="button" class="s-d5-dial" data-off="28" data-on="85" aria-pressed="false">
          <svg viewBox="0 0 140 140" aria-hidden="true">
            <path class="s-d5-track" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <g class="s-d5-ticks" stroke-linecap="round">
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-132 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-66 70 70)"></line>
              <line x1="70" y1="16" x2="70" y2="28" transform="rotate(0 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(66 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(132 70 70)"></line>
            </g>
            <path class="s-d5-arc" pathLength="100" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <line class="s-d5-needle" x1="70" y1="70" x2="70" y2="24"></line>
            <circle class="s-d5-hub" cx="70" cy="70" r="5"></circle>
          </svg>
          <p class="s-d5-read"><b>Purpose</b><span data-num>0</span></p>
          <p class="s-d5-copy" data-off-txt="Work answered what you are for, daily. The question outlives it." data-on-txt="Work worth doing, practised while you still have colleagues.">Work answered what you are for, daily. The question outlives it.</p>
        </button>
        <button type="button" class="s-d5-dial" data-off="16" data-on="74" aria-pressed="false">
          <svg viewBox="0 0 140 140" aria-hidden="true">
            <path class="s-d5-track" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <g class="s-d5-ticks" stroke-linecap="round">
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-132 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(-66 70 70)"></line>
              <line x1="70" y1="16" x2="70" y2="28" transform="rotate(0 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(66 70 70)"></line>
              <line x1="70" y1="19" x2="70" y2="28" transform="rotate(132 70 70)"></line>
            </g>
            <path class="s-d5-arc" pathLength="100" d="M31.8 108.2A54 54 0 1 1 108.2 108.2"></path>
            <line class="s-d5-needle" x1="70" y1="70" x2="70" y2="24"></line>
            <circle class="s-d5-hub" cx="70" cy="70" r="5"></circle>
          </svg>
          <p class="s-d5-read"><b>Connection</b><span data-num>0</span></p>
          <p class="s-d5-copy" data-off-txt="Most work friendships were structural. Remove the structure and you find out." data-on-txt="People who still ring in August, because you built that on purpose.">Most work friendships were structural. Remove the structure and you find out.</p>
        </button>
      </div>
    </div>
    <p class="s-d5-hint">Preparation recharges all four at once. Tap a dial to hold its reading.</p>
  </div>
</section>
<style>
.s-dials-5{padding-block:clamp(2rem,5vw,3.6rem);background:var(--ground);overflow:hidden}
.s-d5-head{max-width:64ch;margin-bottom:clamp(1.6rem,3.6vw,2.4rem)}
.s-d5-h{font:800 clamp(1.9rem,4.4vw,3.1rem)/1.08 var(--sans);letter-spacing:-.01em}
.s-d5-lede{margin-top:.7rem;color:var(--ink-soft);font-size:1.1em}
.s-d5-bankwrap{position:relative}
.s-d5-sweepband{position:absolute;top:0;bottom:0;left:-25%;width:22%;pointer-events:none;z-index:2;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent),transparent);
  mix-blend-mode:multiply;opacity:0}
.s-d5-bank{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(1.6rem,3vw,2rem) clamp(1rem,3vw,1.6rem);position:relative;z-index:1}
@media(min-width:900px){.s-d5-bank{grid-template-columns:repeat(4,1fr)}}
.s-d5-dial{appearance:none;border:0;background:none;font:inherit;text-align:center;cursor:pointer;padding:.6rem .4rem;border-radius:1.2rem;transition:background .2s}
.s-d5-dial:hover,.s-d5-dial:focus-visible{background:var(--ground-3)}
.s-d5-dial svg{width:clamp(150px,40vw,190px);aspect-ratio:1;margin-inline:auto;display:block}
@media(min-width:900px){.s-d5-dial svg{width:clamp(220px,20vw,260px)}}
.s-d5-track{fill:none;stroke:color-mix(in srgb,var(--brand) 15%,var(--ground-3));stroke-width:9;stroke-linecap:round}
.s-d5-ticks line{stroke:var(--ink-soft);stroke-width:2.5;opacity:.5}
.s-d5-arc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;stroke-dasharray:0 100}
.s-d5-dial.is-on .s-d5-arc{stroke:var(--brand)}
.s-d5-needle{stroke:var(--ink);stroke-width:4;stroke-linecap:round}
.s-d5-hub{fill:var(--ink)}
.s-d5-read{margin-top:.5rem;display:flex;flex-direction:column;align-items:center;gap:.15rem}
.s-d5-read b{font:800 1.05rem/1 var(--sans);color:var(--ink)}
.s-d5-read span{font:700 clamp(2.5rem,5vw,3.2rem)/1 var(--num);color:var(--accent)}
.s-d5-dial.is-on .s-d5-read span{color:var(--brand)}
.s-d5-copy{margin-top:.5rem;font-size:.95rem;color:var(--ink-soft);max-width:22ch;margin-inline:auto}
.s-d5-hint{margin-top:clamp(1.6rem,4vw,2.4rem);font-size:.9rem;color:var(--ink-soft);text-align:center}
</style>
<script>
window.slotInit["dials"] = function(root, reduced){
  var dials = Array.prototype.slice.call(root.querySelectorAll(".s-d5-dial"));

  function angle(v){ return -132 + (v/100)*264; }

  dials.forEach(function(d){
    var off = +d.dataset.off, on = +d.dataset.on;
    var needle = d.querySelector(".s-d5-needle");
    var arc = d.querySelector(".s-d5-arc");
    var track = d.querySelector(".s-d5-track");
    var ticks = d.querySelector(".s-d5-ticks");
    var num = d.querySelector("[data-num]");
    var copy = d.querySelector(".s-d5-copy");

    if(reduced){
      gsap.set(needle, {rotation: angle(on), svgOrigin:"70 70"});
      gsap.set(arc, {strokeDasharray: on + " 100"});
      num.textContent = on; d.classList.add("is-on"); copy.textContent = copy.dataset.onTxt;
      return;
    }

    gsap.set(needle, {rotation: angle(0), svgOrigin:"70 70"});

    // entry: ticks + track draw in, needle snaps alive to OFF reading
    var entry = gsap.timeline({ scrollTrigger: { trigger: d, start: "top 85%", once: true } });
    entry.from(track, {drawSVG: "0%", duration: .6, ease: "power2.out"})
         .from(ticks, {opacity: 0, duration: .3}, "-=.3")
         .to(needle, {rotation: angle(off), svgOrigin:"70 70", duration: .5, ease: "back.out(1.4)"}, "-=.2")
         .to({v:0}, {v: off, duration: .5, ease:"power2.out", onUpdate: function(){ num.textContent = Math.round(this.targets()[0].v); }}, "<")
         .to(arc, {strokeDasharray: off + " 100", duration: .5, ease: "power2.out"}, "<");
  });

  var bank = root.querySelector("#s-d5-bank");
  var band = root.querySelector("#s-d5-sweepband");
  if(!reduced){
    // one breakpoint shared by matchMedia and the bank's own grid CSS (900px) —
    // a mismatch here is what let the pin engage while the grid was still
    // two rows, cropping the second row mid-scrub.
    gsap.matchMedia().add({
      isDesktop: "(min-width: 900px)",
      isMobile: "(max-width: 899px)"
    }, function(ctx){
      var scrubOpts = ctx.conditions.isDesktop
        ? { trigger: bank, start: "top center", end: "+=100%", scrub: .7, pin: true, invalidateOnRefresh: true }
        : { trigger: bank, start: "top 70%", end: "bottom 40%", scrub: .6, invalidateOnRefresh: true };

      var tl = gsap.timeline({ scrollTrigger: scrubOpts });
      tl.to(band, {opacity: 1, left: "104%", ease: "none"}, 0);
      dials.forEach(function(d){
        var off = +d.dataset.off, on = +d.dataset.on;
        var needle = d.querySelector(".s-d5-needle");
        var arc = d.querySelector(".s-d5-arc");
        var num = d.querySelector("[data-num]");
        var copy = d.querySelector(".s-d5-copy");
        var proxy = {v: off};
        tl.to(needle, {rotation: angle(on), svgOrigin:"70 70", ease:"none"}, 0)
          .to(arc, {strokeDasharray: on + " 100", ease:"none"}, 0)
          .to(proxy, {v: on, ease:"none", onUpdate: function(){
              num.textContent = Math.round(proxy.v);
              if(proxy.v > (off+on)/2){ d.classList.add("is-on"); copy.textContent = copy.dataset.onTxt; }
              else { d.classList.remove("is-on"); copy.textContent = copy.dataset.offTxt; }
            }}, 0);
      });
      tl.to(band, {opacity: 0, duration: .001}, .96);
    });
  }

  // optional bonus: tap toggles a dial to hold its "on" state explicitly
  dials.forEach(function(d){
    d.addEventListener("click", function(){
      var pressed = d.getAttribute("aria-pressed") === "true";
      d.setAttribute("aria-pressed", String(!pressed));
      var on = +d.dataset.on, off = +d.dataset.off;
      var needle = d.querySelector(".s-d5-needle");
      var arc = d.querySelector(".s-d5-arc");
      var num = d.querySelector("[data-num]");
      var copy = d.querySelector(".s-d5-copy");
      var v = pressed ? off : on;
      gsap.to(needle, {rotation: angle(v), svgOrigin:"70 70", duration:.5, ease:"power2.out"});
      gsap.to(arc, {strokeDasharray: v + " 100", duration:.5, ease:"power2.out"});
      num.textContent = v;
      d.classList.toggle("is-on", !pressed);
      copy.textContent = !pressed ? copy.dataset.onTxt : copy.dataset.offTxt;
    });
  });
};
</script>
