<!-- Why 4 — quiet and centred. Each line fills from pale to full ink as you read down it; nothing moves around. -->
<section class="s-iw4">
  <div class="wrap s-iw4__in">
    <h2 data-copy="why.h" class="s-iw4__h">Here’s how the first week often goes.</h2>
    <p class="s-iw4__line"><b data-copy="why.d1">Friday</b> <span data-copy="why.l1">A cake, a card, a speech. Everyone says “enjoy it”.</span></p>
    <p class="s-iw4__line"><b data-copy="why.d2">Monday</b> <span data-copy="why.l2">No alarm. The coffee’s nice. The house is very quiet.</span></p>
    <p class="s-iw4__line"><b data-copy="why.d3">Wednesday</b> <span data-copy="why.l3">Nobody needs you anywhere. Nobody’s rung.</span></p>
    <p data-copy="why.close" class="s-iw4__close">Nothing went wrong. It just wasn’t planned.</p>
  </div>
</section>
<style>
.s-iw4{background:var(--ground-2);padding-block:clamp(4rem,11vw,8rem)}
.s-iw4__in{max-width:820px;text-align:center}
.s-iw4__h{font:600 clamp(1rem,2vw,1.15rem)/1.3 var(--sans);color:var(--ink-soft);margin-bottom:clamp(2rem,5vw,3rem)}
.s-iw4__line{font:700 clamp(1.45rem,1rem + 2.2vw,2.5rem)/1.25 var(--sans);letter-spacing:-.01em;text-wrap:balance;margin-inline:auto;max-width:26ch}
.s-iw4__line + .s-iw4__line{margin-top:clamp(1.6rem,4vw,2.6rem)}
.s-iw4__line b{color:var(--brand)}
.s-iw4__close{margin:clamp(2.6rem,7vw,4.4rem) auto 0;font:800 clamp(1.7rem,1rem + 3.2vw,3.2rem)/1.1 var(--sans);letter-spacing:-.015em;color:var(--brand-deep);max-width:18ch;text-wrap:balance}
</style>
<script>
window.slotInit["why"] = function(root, reduced){
  if (reduced) return;
  root.querySelectorAll(".s-iw4__line span, .s-iw4__close").forEach(function(el){
    var split = SplitText.create(el, {type:"words"});
    gsap.fromTo(split.words, {opacity:.16}, {opacity:1, stagger:.1, ease:"none", immediateRender:true,
      scrollTrigger:{trigger:el, start:"top 82%", end:"bottom 55%", scrub:.5}});
  });
};
</script>
