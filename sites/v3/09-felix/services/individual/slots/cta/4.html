<!-- CTA 4 — an appointment card: who, how long, what it costs, how it happens. Then the button. -->
<!-- TODO(Felix): confirm "Phone or video" is how first chats run. -->
<section class="s-ic4">
  <div class="wrap s-ic4__in">
    <h2 data-copy="cta.h" class="s-ic4__h">Ready to chat?</h2>
    <p data-copy="cta.lede" class="s-ic4__lede">Book in a friendly 30-minute chat about what your weeks might look like.</p>
    <div class="s-ic4__card">
      <dl class="s-ic4__dl">
        <div><dt>With</dt><dd>Dr San</dd></div>
        <div><dt>Length</dt><dd class="s-ic4__num">30 minutes</dd></div>
        <div><dt>Cost</dt><dd>Free</dd></div>
        <div><dt>How</dt><dd>Phone or video</dd></div>
      </dl>
      <div class="s-ic4__foot">
        <a data-copy="cta.btn" class="btn s-ic4__btn" href="../../contact/#book">Book a time</a>
        <a data-copy="cta.org" class="s-ic4__org" href="../organisation/">See workshops for organisations</a>
      </div>
    </div>
  </div>
</section>
<style>
.s-ic4{background:var(--ground-2);padding-block:clamp(4rem,10vw,7rem)}
.s-ic4__in{max-width:760px}
.s-ic4__h{font:800 clamp(2.1rem,1rem + 4vw,3.6rem)/1.08 var(--sans);letter-spacing:-.02em}
.s-ic4__lede{margin-top:1rem;color:var(--ink-soft);max-width:40ch}
.s-ic4__card{margin-top:clamp(1.8rem,4vw,2.6rem);background:var(--ground);border:1px solid var(--rule-strong);border-radius:.7rem;overflow:hidden}
.s-ic4__dl{margin:0;display:grid;grid-template-columns:1fr 1fr}
.s-ic4__dl div{padding:1rem 1.3rem;border-bottom:1px solid var(--rule)}
.s-ic4__dl div:nth-child(odd){border-right:1px solid var(--rule)}
.s-ic4__dl dt{font:700 .76rem/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.s-ic4__dl dd{margin:.45rem 0 0;font:700 1.15rem/1.3 var(--sans)}
.s-ic4__num{font-family:var(--num)!important;font-size:1.05rem!important}
.s-ic4__foot{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.6rem;padding:1.3rem}
.s-ic4__btn{min-height:52px;font-size:1.05rem;padding:1.1rem 2rem}
.s-ic4__org{color:var(--ink);font-size:1rem;text-decoration-thickness:1px}
.s-ic4__org:hover{color:var(--brand)}
@media (min-width:700px){.s-ic4__dl{grid-template-columns:repeat(4,1fr)}.s-ic4__dl div:nth-child(odd){border-right:0}.s-ic4__dl div+div{border-left:1px solid var(--rule)}}
</style>
<script>
window.slotInit["cta"] = function(root, reduced){
  if (reduced) return;
  gsap.fromTo(root.querySelectorAll(".s-ic4__dl div"), {opacity:0, y:10}, {opacity:1, y:0, duration:.6, ease:"power3.out", stagger:.08, immediateRender:true,
    scrollTrigger:{trigger:root.querySelector(".s-ic4__card"), start:"top 82%", once:true}});
};
</script>
