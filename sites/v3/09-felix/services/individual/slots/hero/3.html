<!-- Hero 3 — text left, framed portrait right on a soft colour block that runs off the edge. -->
<section class="s-ih3">
  <div class="s-ih3__grid">
    <div class="s-ih3__text">
      <p data-copy="hero.name" class="s-ih3__name">Dr San · Psychosocial Retirement Educator</p>
      <h1 data-copy="hero.h1" class="s-ih3__h1">You know the date. Let’s plan the weeks after it.</h1>
      <p data-copy="hero.lede" class="s-ih3__lede">Human-centred retirement planning for individuals and couples, alongside your financial plan.</p>
      <a data-copy="hero.btn" class="btn s-ih3__btn" href="../../contact/#book">Book a friendly 30-minute chat</a>
      <p class="s-ih3__org"><a data-copy="hero.org" href="../organisation/">See workshops for organisations</a></p>
    </div>
    <div class="s-ih3__side">
      <figure class="s-ih3__frame">
        <img src="../../assets/drsan.jpg" width="980" height="1470" alt="Dr San, smiling, looking toward the camera">
      </figure>
    </div>
  </div>
</section>
<style>
.s-ih3{background:var(--ground);overflow:hidden}
.s-ih3__grid{display:grid;grid-template-columns:1fr}
.s-ih3__text{padding:clamp(2rem,6vw,3rem) var(--gut) 2rem;max-width:40rem}
.s-ih3__name{font:500 .95rem/1.4 var(--sans);color:var(--ink-soft);margin-bottom:1.1rem}
.s-ih3__h1{font:800 clamp(2rem,1.3rem + 2.8vw,3.9rem)/1.05 var(--sans);letter-spacing:-.02em;text-wrap:balance}
.s-ih3__lede{margin-top:1.2rem;font-size:clamp(1.1rem,.5vw + 1rem,1.3rem);color:var(--ink-soft);max-width:36ch;text-wrap:pretty}
.s-ih3__btn{margin-top:2rem;min-height:48px}
.s-ih3__org{margin-top:1.4rem;font-size:1rem}
.s-ih3__org a{color:var(--ink);text-decoration-thickness:1px}
.s-ih3__org a:hover{color:var(--brand)}
.s-ih3__side{background:var(--ground-3);padding:1.6rem var(--gut) 0;display:flex;justify-content:center}
.s-ih3__frame{margin:0;width:min(100%,380px);aspect-ratio:4/5;overflow:hidden;border-radius:.7rem .7rem 0 0}
.s-ih3__frame img{width:100%;height:100%;object-fit:cover;object-position:50% 16%}
@media (min-width:900px){
  .s-ih3__grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);min-height:min(88svh,780px)}
  .s-ih3__text{align-self:center;padding:clamp(3rem,5vw,5rem) clamp(2rem,4vw,4rem) clamp(3rem,5vw,5rem) max(var(--gut),calc((100vw - 1240px)/2 + var(--gut)))}
  .s-ih3__side{padding:clamp(3rem,6vw,5rem) 0 0 clamp(2rem,4vw,3.5rem);justify-content:flex-start;align-items:flex-end}
  .s-ih3__frame{width:min(100%,440px);aspect-ratio:3/4}
}
</style>
<script>
window.slotInit["hero"] = function(root, reduced){
  if (reduced) return;
  var f = root.querySelector(".s-ih3__frame");
  gsap.fromTo(f, {clipPath:"inset(100% 0 0 0)"}, {clipPath:"inset(0% 0 0 0)", duration:1.3, ease:"expo.out", delay:.1, immediateRender:true});
  gsap.fromTo(f.querySelector("img"), {scale:1.1}, {scale:1, duration:1.6, ease:"power3.out", immediateRender:true});
};
</script>
