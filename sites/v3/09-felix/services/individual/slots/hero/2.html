<!-- Hero 2 — words first, then a wide photo band that opens up (clip-path) as the page settles. -->
<section class="s-ih2">
  <div class="wrap s-ih2__text">
    <p data-copy="hero.name" class="s-ih2__name">Dr San · Psychosocial Retirement Educator</p>
    <h1 data-copy="hero.h1" class="s-ih2__h1">You know the date. Now plan the weeks after it.</h1>
    <p data-copy="hero.lede" class="s-ih2__lede">Human-centred retirement planning for individuals and couples, alongside your financial plan.</p>
    <div class="s-ih2__acts">
      <a data-copy="hero.btn" class="btn" href="../../contact/#book">Book a friendly 30-minute chat</a>
      <a data-copy="hero.org" class="s-ih2__org" href="../organisation/">See workshops for organisations</a>
    </div>
  </div>
  <figure class="s-ih2__band">
    <img src="../../assets/drsan.jpg" width="980" height="1470" alt="Dr San, smiling, looking toward the camera">
  </figure>
</section>
<style>
.s-ih2{background:var(--ground-2);padding-top:clamp(2.5rem,7vw,5.5rem)}
.s-ih2__text{text-align:center;display:flex;flex-direction:column;align-items:center}
.s-ih2__name{font:500 .95rem/1.4 var(--sans);color:var(--ink-soft);margin-bottom:1.2rem}
.s-ih2__h1{font:800 clamp(2.1rem,1.2rem + 3.6vw,4.4rem)/1.04 var(--sans);letter-spacing:-.02em;max-width:18ch;text-wrap:balance}
.s-ih2__lede{margin-top:1.3rem;font-size:clamp(1.1rem,.5vw + 1rem,1.3rem);color:var(--ink-soft);max-width:40ch;text-wrap:pretty}
.s-ih2__acts{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:1rem 1.6rem;margin-top:2rem}
.s-ih2__acts .btn{min-height:48px}
.s-ih2__org{color:var(--ink);font-weight:500;text-decoration-thickness:1px;padding-block:.5rem}
.s-ih2__org:hover{color:var(--brand)}
.s-ih2__band{margin:clamp(2.5rem,6vw,4rem) 0 0;height:clamp(280px,46svh,500px);overflow:hidden;clip-path:inset(0 0 0 0)}
.s-ih2__band img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
@media (min-width:860px){.s-ih2__band{margin-inline:var(--gut);border-radius:.7rem .7rem 0 0}}
</style>
<script>
window.slotInit["hero"] = function(root, reduced){
  if (reduced) return;
  var band = root.querySelector(".s-ih2__band"), img = band.querySelector("img");
  gsap.fromTo(band, {clipPath:"inset(18% 12% 0% 12%)"}, {clipPath:"inset(0% 0% 0% 0%)", duration:1.4, ease:"expo.out", delay:.15, immediateRender:true});
  gsap.fromTo(img, {scale:1.08}, {scale:1, duration:1.8, ease:"power3.out", immediateRender:true});
};
</script>
