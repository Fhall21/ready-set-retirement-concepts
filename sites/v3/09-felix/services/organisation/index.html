(function(){try{
  var q=new URL(location.href).searchParams.get("pal");
  var p=(q||"b") /* this page defaults to palette B (its default preset); ?pal= or a preset overrides */.toLowerCase();
  if(p!=="b")p="a";
  document.documentElement.setAttribute("data-pal",p);
}catch(e){}})();
</script>

<script>
/* Presets on this page may carry a palette ("pal": "a"|"b" in presets.json). Choosing one from the mixer,
   or opening ?preset=<name>, switches the palette and writes ?pal= into the URL so "Copy link" keeps it.
   An explicit ?pal= in the URL always wins on load. */
(function(){
  function setPal(p){
    if (p !== "a" && p !== "b") return;
    document.documentElement.setAttribute("data-pal", p);
    try { var u = new URL(location.href); u.searchParams.set("pal", p); history.replaceState(null, "", u); } catch(e){}
  }
  function presetPal(name){
    var m = window.Vitals && Vitals.manifest;
    return m && m.presets && m.presets[name] && m.presets[name].pal;
  }
  document.addEventListener("change", function(e){
    if (e.target.matches && e.target.matches(".mx select")) setPal(presetPal(e.target.value));
  });
  var q = new URL(location.href).searchParams, name = q.get("preset");
  if (name && !q.get("pal")) document.addEventListener("vitals:change", function once(){
    document.removeEventListener("vitals:change", once); setPal(presetPal(name));
  });
})();
</script>
