<!-- Proof 1: the one real testimonial, as a full-width pull-quote band (the home page's winning treatment).
     TODO(Felix): if Dr San has organisations happy to be named, or a workshop quote she has permission to use, add it here. Never invent one. -->
<section class="s-oproof-1">
  <figure class="s-oproof-1-band">
    <div class="wrap s-oproof-1-in">
      <h2 data-copy="proof.h" class="s-oproof-1-h">From someone who’s been through it</h2>
      <svg class="s-oproof-1-mark" viewBox="0 0 64 48" aria-hidden="true" focusable="false"><path d="M0 48V28C0 12 8 3 24 0l3 6C17 9 13 15 12 22h12v26H0Zm37 0V28C37 12 45 3 61 0l3 6c-10 3-14 9-15 16h12v26H37Z"></path></svg>
      <blockquote>
        <p>Financial planning for retirement is well known. I hadn’t heard about psychosocial education focused on human-centred retirement planning — in 30 years of politics. In talking with Dr San I realised the critical need to plan for the human side of retirement. <span class="hl">With hand on heart, I can honestly say that engaging Dr San has been life changing.</span></p>
      </blockquote>
      <figcaption><span class="rule" aria-hidden="true"></span><span><strong>Hon. Warren Entsch</strong><br>Former Federal Member for Leichhardt</span></figcaption>
    </div>
  </figure>
</section>
<style>
.s-oproof-1-band{margin:0;padding-block:clamp(3.5rem,9vw,7.5rem);background:var(--ground-2);border-block:1px solid var(--rule)}
.s-oproof-1-in{max-width:1040px}
.s-oproof-1-h{font:600 clamp(1.05rem,.5vw + 1rem,1.2rem)/1.4 var(--sans);color:var(--ink-soft);margin-bottom:1.4rem}
.s-oproof-1-mark{display:block;width:clamp(44px,6vw,72px);height:auto;fill:var(--brand);margin-bottom:clamp(1.4rem,3vw,2.2rem)}
.s-oproof-1-band blockquote{margin:0}
.s-oproof-1-band blockquote p{font-size:clamp(1.45rem,1rem + 2.2vw,2.6rem);line-height:1.28;font-weight:500;letter-spacing:-.018em;text-wrap:pretty}
.s-oproof-1-band .hl{font-weight:800;color:var(--brand-deep)}
.s-oproof-1-band figcaption{display:flex;align-items:center;gap:1.1rem;margin-top:clamp(2rem,4vw,3rem);font-size:1.05rem;line-height:1.4;color:var(--ink-soft)}

<script>
window.slotInit["proof"] = function(root, reduced){
  if (reduced) return;
  gsap.fromTo(root.querySelector(".s-oproof-1-mark"), {scale:.6, opacity:0, transformOrigin:"left bottom"}, {scale:1, opacity:1, duration:1, ease:"expo.out",
    scrollTrigger:{trigger:root, start:"top 75%", toggleActions:"play none none none"}});
  gsap.fromTo(root.querySelector(".hl"), {backgroundSize:"0% 100%"}, {backgroundSize:"100% 100%", duration:1.4, ease:"power2.out", delay:.3,
    scrollTrigger:{trigger:root.querySelector(".hl"), start:"top 80%", toggleActions:"play none none none"}});
};
</script>
<style>
