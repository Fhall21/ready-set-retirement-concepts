<script>
window.slotInit["proof"] = function(root, reduced){

  var split = new SplitText(big, {type:"lines", linesClass:"ln", mask:"lines"});
  gsap.fromTo(split.lines, {yPercent:100}, {yPercent:0, duration:1, stagger:.1, ease:"expo.out",
