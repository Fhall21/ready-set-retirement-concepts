<!-- Problem 3: a felt moment. Friday's farewell, then Monday morning, arriving as you scroll.
     Desktop pins for ~110vh (under the 150vh limit); phones get the same two beats without a pin. -->
<section class="s-oprob-3">
  <div class="s-oprob-3-stage">
    <div class="wrap s-oprob-3-in">
      <h2 data-copy="problem.h" class="s-oprob-3-h">When someone retires, the paperwork gets done. The rest is left to them.</h2>
      <div class="s-oprob-3-beats">
        <div class="s-oprob-3-beat fri">
          <p class="s-oprob-3-when"><span class="s-oprob-3-day">Friday</span> <span class="s-oprob-3-time">3:00 pm</span></p>
          <p class="s-oprob-3-what">Morning tea runs long. A card, a speech, thirty-one years.</p>
        </div>
        <div class="s-oprob-3-beat mon">
          <p class="s-oprob-3-when"><span class="s-oprob-3-day">Monday</span> <span class="s-oprob-3-time">9:00 am</span></p>
          <p class="s-oprob-3-what">No meetings. Nobody expecting them anywhere.</p>
        </div>
      </div>
      <p data-copy="problem.close" class="s-oprob-3-close">It’s easier to prepare while they’re still at work, with colleagues around them.</p>
    </div>
  </div>
</section>
<style>
.s-oprob-3{background:var(--ground-2)}
.s-oprob-3-stage{min-height:100svh;display:flex;align-items:center;padding-block:clamp(3.5rem,8vw,5rem)}
.s-oprob-3-in{width:100%;max-width:1000px}
.s-oprob-3-h{font:600 clamp(1.05rem,.5vw + 1rem,1.25rem)/1.4 var(--sans);color:var(--brand-deep);max-width:40ch;margin-bottom:clamp(2rem,5vw,3.5rem)}
.s-oprob-3-beats{display:grid;gap:clamp(2rem,5vw,3.2rem)}
.s-oprob-3-beat{display:grid;gap:.6rem}
.s-oprob-3-when{display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap}
.s-oprob-3-day{font:800 clamp(2.4rem,1rem + 5vw,5rem)/1 var(--sans);letter-spacing:-.03em}
.s-oprob-3-time{font:700 clamp(1rem,.6vw + .9rem,1.35rem)/1 var(--num);color:var(--ink-soft)}
.s-oprob-3-beat.mon .s-oprob-3-day{color:var(--accent)}
.s-oprob-3-what{font:500 clamp(1.15rem,.8vw + 1rem,1.55rem)/1.4 var(--sans);color:var(--ink-soft);max-width:36ch}
.s-oprob-3-close{margin-top:clamp(2.4rem,6vw,3.6rem);padding-top:1.4rem;border-top:1px solid var(--rule-strong);font:700 clamp(1.25rem,1vw + 1rem,1.7rem)/1.35 var(--sans);max-width:34ch}
</style>
<script>
window.slotInit["problem"] = function(root, reduced){
  if (reduced) return;
  var fri = root.querySelector(".fri"), mon = root.querySelector(".mon"), close = root.querySelector(".s-oprob-3-close");
  // Static breakpoint check rather than gsap.matchMedia (see format/3 note).
  var c = {conditions:{desk: matchMedia("(min-width:900px) and (min-height:640px)").matches}};
  (function(){
    if (c.conditions.desk) {
      var tl = gsap.timeline({scrollTrigger:{trigger:root, start:"top top", end:"+=110%", scrub:.8, pin:true, invalidateOnRefresh:true}});
      tl.fromTo(mon, {opacity:0, y:30}, {opacity:1, y:0, ease:"none", duration:1}, .3)
        .to(fri, {opacity:.35, ease:"none", duration:.8}, .45)
        .fromTo(close, {opacity:0}, {opacity:1, ease:"none", duration:.6}, 1.2);
    } else {
      gsap.fromTo([mon, close], {opacity:0, y:24}, {opacity:1, y:0, duration:.9, stagger:.5, ease:"expo.out",
        scrollTrigger:{trigger:mon, start:"top 82%", toggleActions:"play none none none"}});
    }
  })();
};
</script>
