<!-- Sign-off: closes the story the way a letter would. -->
<section class="ab-ct4">
  <div class="wrap ab-ct4-in">
    <h2 data-copy="cta.h" class="ab-ct4-h">Ready to chat?</h2>
    <p data-copy="cta.lede" class="ab-ct4-lede">Book in a 30-minute friendly chat. Tell me about the date, and we’ll start there.</p>
    <div class="ab-ct4-sign">
      <span class="ab-ct4-bye">Talk soon,</span>
      <span class="ab-ct4-name">San</span>
      <svg viewBox="0 0 160 20" aria-hidden="true"><path d="M3 13 C 30 5, 70 3, 100 9 S 145 16, 157 6"/></svg>
    </div>
    <a data-copy="cta.btn" class="btn ab-ct4-btn" href="../contact/#book">Book a time</a>
  </div>
</section>
<style>
.ab-ct4{background:var(--ground-2);border-top:1px solid var(--rule);padding-block:clamp(4rem,10vw,7rem)}
.ab-ct4-in{max-width:40rem}
.ab-ct4-h{font:800 clamp(2rem,3.4vw + .6rem,3.2rem)/1.08 var(--sans);letter-spacing:-.02em}
.ab-ct4-lede{margin-top:1rem;color:var(--ink-soft);max-width:40ch}
.ab-ct4-sign{display:inline-grid;margin-top:2rem}
.ab-ct4-bye{font:italic 500 1.15rem/1.3 var(--sans);color:var(--ink-soft)}
.ab-ct4-name{font:italic 800 clamp(2.2rem,3vw + 1rem,3rem)/1.05 var(--sans);color:var(--ink)}
.ab-ct4-sign svg{width:100%;height:1rem;overflow:visible;margin-top:.1rem}
.ab-ct4-sign path{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round}
.ab-ct4-btn{display:flex;width:max-content;margin-top:2.2rem;min-height:48px}
</style>
<script>
window.slotInit["cta"] = function(root, reduced){
  if (reduced) return;
  gsap.fromTo(root.querySelector(".ab-ct4-sign path"), {drawSVG:"0%"}, {drawSVG:"100%", duration:1, ease:"power2.inOut", immediateRender:true,
    scrollTrigger:{trigger:root.querySelector(".ab-ct4-sign"), start:"top 88%", once:true}});
};
</script>
