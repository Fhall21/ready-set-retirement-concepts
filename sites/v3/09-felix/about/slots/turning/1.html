<!-- TODO(Felix): the turning point is phrased as a pattern Dr San saw, not a specific event. If she has a real moment (a person, a year), use it instead. -->
<section class="ab-tp1">
  <div class="wrap ab-tp1-in">
    <p data-copy="turning.lead" class="ab-tp1-lead">Here’s what I kept seeing.</p>
    <h2 data-copy="turning.big" class="ab-tp1-big">The super was sorted. The date was set. The farewell was lovely. Then came <span class="ab-tp1-acc">Monday.</span></h2>
    <p data-copy="turning.close" class="ab-tp1-close">It happens to people who did everything else right.</p>
  </div>
</section>
<style>
.ab-tp1{background:var(--ground)}
.ab-tp1-in{min-height:88svh;display:flex;flex-direction:column;justify-content:center;padding-block:clamp(3.5rem,9vw,6rem);max-width:1100px}
.ab-tp1-lead{font:600 clamp(1.05rem,1.2vw + .8rem,1.3rem)/1.3 var(--sans);color:var(--brand-deep);margin-bottom:1.2rem}
.ab-tp1-big{font:800 clamp(2rem,4.2vw + .6rem,4.6rem)/1.08 var(--sans);letter-spacing:-.025em;text-wrap:balance}
.ab-tp1-big span,.ab-tp1-acc{color:var(--accent)}
.ab-tp1-close{margin-top:clamp(1.8rem,4vw,2.8rem);font:500 clamp(1.2rem,1vw + 1rem,1.6rem)/1.4 var(--sans);color:var(--ink-soft);max-width:34ch}
</style>
<script>
window.slotInit["turning"] = function(root, reduced){
  if (reduced) return;
  var big = root.querySelector(".ab-tp1-big"), close = root.querySelector(".ab-tp1-close"),
      sec = root.querySelector(".ab-tp1");
  var split = new SplitText(big, {type:"words"});
  var mm = gsap.matchMedia();
  // words come up to full ink one by one as you scroll, so the sentence is read at walking pace
  mm.add("(min-width: 900px)", function(){
    var tl = gsap.timeline({scrollTrigger:{trigger:sec, start:"top top", end:"+=110%", scrub:.8, pin:true, invalidateOnRefresh:true}});
    tl.fromTo(split.words, {opacity:.14}, {opacity:1, stagger:.1, ease:"none"}, 0)
      .fromTo(close, {opacity:0, y:12}, {opacity:1, y:0, ease:"none"}, ">-.1")
      .to({}, {duration:.4});
  });
  mm.add("(max-width: 899px)", function(){
    var tl = gsap.timeline({scrollTrigger:{trigger:big, start:"top 80%", end:"bottom 45%", scrub:.6}});
    tl.fromTo(split.words, {opacity:.14}, {opacity:1, stagger:.1, ease:"none"}, 0)
      .fromTo(close, {opacity:0}, {opacity:1, ease:"none"});
  });
};
</script>
