<!-- The farewell card: from Dr San's own line "The other question gets a good luck and a card" (Dr_San_for_Felix.md #4).
     Signatures on the card are an illustration, not quotes from real people.
     TODO(Felix): the turning point is phrased as a pattern Dr San saw, not a specific event. Confirm with her. -->
<section class="ab-tp3">
  <div class="wrap ab-tp3-grid">
    <div class="ab-tp3-text">
      <p data-copy="turning.lead" class="ab-tp3-lead">Here’s what I kept seeing.</p>
      <h2 data-copy="turning.big" class="ab-tp3-big">The super was sorted. The date was set. The farewell was lovely. Then came <span>Monday.</span></h2>
      <p data-copy="turning.close" class="ab-tp3-close">It happens to people who did everything else right.</p>
    </div>
    <div class="ab-tp3-stage" aria-hidden="true">
      <div class="ab-tp3-card">
        <p class="ab-tp3-gl">Good luck!</p>
        <p class="ab-tp3-sig" style="--r:-3deg">Enjoy every minute. <b>Marg</b></p>
        <p class="ab-tp3-sig" style="--r:2deg">Don’t be a stranger! <b>Dave &amp; the team</b></p>
        <p class="ab-tp3-sig" style="--r:-1deg">You’ve earned it. <b>Priya</b></p>
      </div>
    </div>
  </div>
</section>
<style>
.ab-tp3{background:var(--ground);padding-block:clamp(3.5rem,9vw,7rem);overflow:hidden}
.ab-tp3-grid{display:grid;gap:clamp(2.5rem,6vw,5rem);align-items:center}
@media (min-width:900px){.ab-tp3-grid{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}}
.ab-tp3-lead{font:600 1.1rem/1.3 var(--sans);color:var(--brand-deep);margin-bottom:1rem}
.ab-tp3-big{font:800 clamp(1.8rem,2.8vw + .7rem,3.4rem)/1.1 var(--sans);letter-spacing:-.02em;text-wrap:balance}
.ab-tp3-big span{color:var(--accent)}
.ab-tp3-close{margin-top:1.6rem;font:500 clamp(1.1rem,.6vw + 1rem,1.35rem)/1.45 var(--sans);color:var(--ink-soft);max-width:34ch}
.ab-tp3-stage{display:grid;place-items:center;padding:1rem;perspective:1200px}
.ab-tp3-card{width:min(100%,24rem);aspect-ratio:5/6;background:var(--ground);border:1px solid var(--rule-strong);border-radius:.5rem;
  padding:clamp(1.6rem,4vw,2.4rem);display:flex;flex-direction:column;gap:1.1rem;transform:rotate(-3deg);
  box-shadow:0 30px 60px -32px color-mix(in srgb,var(--brand-deep) 45%,transparent);
  background-image:radial-gradient(circle at 88% 12%,color-mix(in srgb,var(--gold) 55%,transparent) 0 2.2rem,transparent 2.3rem),
                   radial-gradient(circle at 8% 92%,color-mix(in srgb,var(--brand-bright) 22%,transparent) 0 3rem,transparent 3.1rem)}
.ab-tp3-gl{font:italic 800 clamp(2.4rem,4vw + 1rem,3.6rem)/1 var(--sans);color:var(--brand);letter-spacing:-.02em;margin-bottom:.6rem}
.ab-tp3-sig{font:italic 500 1.02rem/1.35 var(--sans);color:var(--ink-soft);transform:rotate(var(--r))}
.ab-tp3-sig b{display:block;font-weight:700;color:var(--ink)}
</style>
<script>
window.slotInit["turning"] = function(root, reduced){
  if (reduced) return;
  // the card lifts into view and settles, as if handed across the desk
  gsap.fromTo(root.querySelector(".ab-tp3-card"),
    {y:120, rotate:10, opacity:0}, {y:0, rotate:-3, opacity:1, ease:"none",
    scrollTrigger:{trigger:root.querySelector(".ab-tp3-stage"), start:"top 95%", end:"center 55%", scrub:.7}});
};
</script>
