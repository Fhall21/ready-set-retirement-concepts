<!-- turning/5: turning/1's pinned word-by-word sentence + the home page's week calendar (slots/monday).
     As the sentence is read, the working week quietly greys out; when "Monday." lands, the empty Monday is all that's lit.
     Mission/5 picks up this same calendar and fills that Monday. TODO(Felix): turning point is a pattern, not a sourced event. -->
<section class="ab-tp5">
  <div class="wrap ab-tp5-in">
    <p data-copy="turning.lead" class="ab-tp5-lead">Here’s what I kept seeing.</p>
    <h2 data-copy="turning.big" class="ab-tp5-big">The super was sorted. The date was set. The farewell was lovely. Then came <span class="ab-tp5-acc">Monday.</span></h2>
    <div class="ab-tp5-cal" aria-hidden="true">
      <div class="ab-tp5-col"><b>Mon</b><i style="top:30%;height:22%"></i><i class="g" style="top:62%;height:18%"></i></div>
      <div class="ab-tp5-col"><b>Tue</b><i class="l" style="top:26%;height:16%"></i><i style="top:50%;height:26%"></i></div>
      <div class="ab-tp5-col"><b>Wed</b><i style="top:34%;height:20%"></i><i class="l" style="top:62%;height:14%"></i></div>
      <div class="ab-tp5-col"><b>Thu</b><i class="g" style="top:28%;height:18%"></i><i style="top:54%;height:20%"></i></div>
      <div class="ab-tp5-col"><b>Fri</b><i class="l" style="top:30%;height:14%"></i><i class="fw" style="top:52%;height:28%"><em>Farewell</em></i></div>
      <div class="ab-tp5-col ab-tp5-mon"><b>Mon</b></div>
    </div>
    <p data-copy="turning.close" class="ab-tp5-close">It happens to people who did everything else right.</p>
  </div>
</section>
<style>
.ab-tp5{background:var(--ground)}
.ab-tp5-in{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-block:clamp(3.5rem,9vw,6rem);max-width:1100px}
.ab-tp5-lead{font:600 clamp(1.05rem,1.2vw + .8rem,1.3rem)/1.3 var(--sans);color:var(--brand-deep);margin-bottom:1.2rem}
.ab-tp5-big{font:800 clamp(2rem,3.6vw + .6rem,4rem)/1.08 var(--sans);letter-spacing:-.025em;text-wrap:balance;max-width:24ch}
.ab-tp5-big>span,.ab-tp5-acc{color:var(--accent)}
.ab-tp5-cal{margin-top:clamp(2rem,5vh,3rem);display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule);height:clamp(130px,20vh,190px);width:100%;border-radius:.5rem;overflow:hidden}
.ab-tp5-col{position:relative;background:var(--ground-2)}
.ab-tp5-col b{position:absolute;inset:0 0 auto;text-align:center;padding:.4rem 0;font:700 .72rem/1 var(--num);color:var(--ink-soft);border-bottom:1px solid var(--rule);background:var(--ground)}
.ab-tp5-col i{position:absolute;left:10%;right:10%;border-radius:.3rem;background:var(--brand);opacity:.85}
.ab-tp5-col i.l{background:var(--brand-bright)}
.ab-tp5-col i.g{background:var(--gold)}
.ab-tp5-col i.fw{background:var(--accent)}
.ab-tp5-col em{display:block;padding:.3rem .35rem;font:600 .66rem/1.2 var(--sans);font-style:normal;color:#fff}
.ab-tp5-mon{background:var(--ground-3)}
.ab-tp5-mon b{color:var(--accent)}
.ab-tp5-close{margin-top:clamp(1.6rem,4vh,2.4rem);font:500 clamp(1.15rem,1vw + .95rem,1.5rem)/1.4 var(--sans);color:var(--ink-soft);max-width:34ch}
@media (max-width:600px){.ab-tp5-col em{display:none}}
</style>
<script>
window.slotInit["turning"] = function(root, reduced){
  if (reduced) return;
  var sec = root.querySelector(".ab-tp5"), big = root.querySelector(".ab-tp5-big"), close = root.querySelector(".ab-tp5-close"),
      week = root.querySelectorAll(".ab-tp5-col:not(.ab-tp5-mon)"), mon = root.querySelector(".ab-tp5-mon");
  var split = new SplitText(big, {type:"words"});
  function build(tl){
    // the sentence is read word by word; the working week fades as it is read, leaving only the empty Monday
    tl.fromTo(split.words, {opacity:.14}, {opacity:1, stagger:.1, ease:"none", duration:.4}, 0)
      .to(week, {opacity:.28, stagger:.12, ease:"none", duration:.5}, .25)
      .fromTo(mon, {boxShadow:"inset 0 0 0 0 transparent"}, {boxShadow:"inset 0 0 0 2px var(--accent)", ease:"none", duration:.3}, ">-.1")
      .fromTo(close, {opacity:0, y:12}, {opacity:1, y:0, ease:"none", duration:.3}, ">");
    return tl;
  }
  var mm = gsap.matchMedia();
  mm.add("(min-width: 900px)", function(){
    build(gsap.timeline({scrollTrigger:{trigger:sec, start:"top top", end:"+=150%", scrub:.8, pin:true, invalidateOnRefresh:true}})).to({}, {duration:.5});
  });
  mm.add("(max-width: 899px)", function(){
    build(gsap.timeline({scrollTrigger:{trigger:big, start:"top 80%", end:"bottom+=180 45%", scrub:.6}}));
  });
};
</script>
