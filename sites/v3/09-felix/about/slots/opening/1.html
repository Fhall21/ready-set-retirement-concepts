<section class="ab-op1">
  <div class="ab-op1-grid">
    <div class="ab-op1-text">
      <p data-copy="opening.name" class="ab-op1-name">Dr San · Psychosocial Retirement Educator</p>
      <h1 data-copy="opening.h" class="ab-op1-h">Hello, I’m Dr San.</h1>
      <p data-copy="opening.sub" class="ab-op1-sub">I help people plan the human side of retirement.</p>
    </div>
    <figure class="ab-op1-photo">
      <img src="assets/drsan-office.jpg" width="1100" height="1650" alt="Dr San standing in her office, arms folded, smiling, with a bookshelf behind her">
    </figure>
  </div>
</section>
<style>
.ab-op1{background:var(--ground);overflow:hidden}
.ab-op1-grid{display:grid;grid-template-columns:1fr}
.ab-op1-photo{margin:0;order:-1;position:relative;height:clamp(260px,42svh,380px);overflow:hidden;background:var(--ground-2)}
.ab-op1-photo img{width:100%;height:100%;object-fit:cover;object-position:50% 16%}
.ab-op1-text{padding:1.6rem var(--gut) 3rem;max-width:40rem}
.ab-op1-name{font:500 .95rem/1.4 var(--sans);color:var(--ink-soft);margin-bottom:1.1rem}
.ab-op1-h{font:800 clamp(2.3rem,3.6vw + 1.2rem,5rem)/1.02 var(--sans);letter-spacing:-.025em;text-wrap:balance}
.ab-op1-sub{margin-top:1.3rem;font:400 clamp(1.15rem,.6vw + 1rem,1.45rem)/1.45 var(--sans);color:var(--ink-soft);max-width:30ch;text-wrap:pretty}
@media (min-width:860px){
  .ab-op1-grid{grid-template-columns:minmax(0,7fr) minmax(0,5fr);min-height:min(92svh,860px)}
  .ab-op1-photo{order:0;height:auto}
  .ab-op1-photo img{position:absolute;inset:0;object-position:50% 20%}
  .ab-op1-text{align-self:center;padding:clamp(3rem,6vw,6rem) clamp(2rem,6vw,6rem);max-width:44rem;justify-self:end}
}
</style>
<script>
window.slotInit["opening"] = function(root, reduced){
  if (reduced) return;
  gsap.fromTo(root.querySelector(".ab-op1-photo"),
    {clipPath:"inset(100% 0% 0% 0%)"}, {clipPath:"inset(0% 0% 0% 0%)", duration:1.4, ease:"expo.out", delay:.1, immediateRender:true});
  gsap.fromTo(root.querySelector(".ab-op1-photo img"),
    {scale:1.08}, {scale:1, duration:1.8, ease:"power3.out", immediateRender:true});
};
</script>
