<section class="ab-op4">
  <div class="wrap ab-op4-grid">
    <div class="ab-op4-text">
      <p data-copy="opening.name" class="ab-op4-name">Dr San · Psychosocial Retirement Educator</p>
      <h1 data-copy="opening.h" class="ab-op4-h">Hello, I’m Dr San.</h1>
      <p data-copy="opening.sub" class="ab-op4-sub">I help people plan the human side of retirement.</p>
    </div>
    <div class="ab-op4-pics">
      <figure class="ab-op4-a"><img src="../assets/drsan.jpg" width="980" height="1470" alt="Dr San in a pale gold jacket, smiling"></figure>
      <figure class="ab-op4-b"><img src="assets/drsan-office.jpg" width="1100" height="1650" alt="Dr San standing in her office, arms folded"></figure>
    </div>
  </div>
</section>
<style>
.ab-op4{background:var(--ground);padding-block:clamp(2.5rem,7vw,5.5rem) clamp(3.5rem,9vw,7rem);overflow:hidden}
.ab-op4-grid{display:grid;gap:clamp(2.5rem,5vw,4rem);align-items:center}
.ab-op4-name{font:500 .95rem/1.4 var(--sans);color:var(--ink-soft);margin-bottom:1.1rem}
.ab-op4-h{font:800 clamp(2.4rem,3.6vw + 1.1rem,4.8rem)/1.02 var(--sans);letter-spacing:-.025em;text-wrap:balance}
.ab-op4-sub{margin-top:1.3rem;font:400 clamp(1.15rem,.6vw + 1rem,1.45rem)/1.45 var(--sans);color:var(--ink-soft);max-width:30ch}
.ab-op4-pics{display:grid;grid-template-columns:1fr 1fr;gap:clamp(.75rem,2vw,1.4rem);align-items:start}
.ab-op4-pics figure{margin:0;border-radius:1.1rem;overflow:hidden;background:var(--ground-2);aspect-ratio:4/5}
.ab-op4-pics img{width:100%;height:100%;object-fit:cover}
.ab-op4-a img{object-position:50% 14%}
.ab-op4-b{margin-top:clamp(2.5rem,8vw,6rem)!important}
.ab-op4-b img{object-position:50% 12%}
@media (min-width:900px){.ab-op4-grid{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
</style>
<script>
window.slotInit["opening"] = function(root, reduced){
  if (reduced) return;
  // two photos drift gently apart as the page scrolls on
  var st = {trigger:root, start:"top top", end:"bottom top", scrub:.6};
  gsap.fromTo(root.querySelector(".ab-op4-a"), {y:0}, {y:-40, ease:"none", scrollTrigger:st});
  gsap.fromTo(root.querySelector(".ab-op4-b"), {y:0}, {y:50, ease:"none", scrollTrigger:Object.assign({}, st)});
};
</script>
