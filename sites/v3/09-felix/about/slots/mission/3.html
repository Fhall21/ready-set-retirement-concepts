<!-- Mission as a short signed note from Dr San. -->
<section class="ab-mi3">
  <div class="wrap">
    <article class="ab-mi3-note">
      <h2 data-copy="mission.h" class="ab-mi3-h">So now I teach the other half of the plan.</h2>
      <p data-copy="mission.big" class="ab-mi3-big"><span>One pays for the life.</span> <span>The other helps you live it.</span></p>
      <p data-copy="mission.lede" class="ab-mi3-lede">Human-centred retirement planning™ sits alongside your financial plan. I offer coaching, workshops, seminars, training, consulting and talks.</p>
      <div class="ab-mi3-sign">
        <span class="ab-mi3-name">Dr San</span>
        <svg viewBox="0 0 220 24" aria-hidden="true"><path d="M3 16 C 40 6, 80 4, 120 11 S 190 20, 217 7"/></svg>
      </div>
      <p class="ab-mi3-org"><a data-copy="mission.org" href="../services/organisation/">See workshops for organisations</a></p>
    </article>
  </div>
</section>
<style>
.ab-mi3{background:var(--ground-2);padding-block:clamp(3.5rem,9vw,7rem);border-block:1px solid var(--rule)}
.ab-mi3-note{max-width:44rem;margin-inline:auto;background:var(--ground);border:1px solid var(--rule-strong);border-radius:.7rem;padding:clamp(1.8rem,6vw,4rem)}
.ab-mi3-h{font:700 clamp(1.25rem,1vw + 1rem,1.6rem)/1.3 var(--sans);color:var(--brand-deep)}
.ab-mi3-big{margin-top:1.4rem;font:800 clamp(1.9rem,2.6vw + .8rem,3.1rem)/1.08 var(--sans);letter-spacing:-.02em;text-wrap:balance}
.ab-mi3-big span + span{color:var(--brand)}
.ab-mi3-lede{margin-top:1.4rem;color:var(--ink-soft);text-wrap:pretty}
.ab-mi3-sign{margin-top:2.2rem;display:inline-grid}
.ab-mi3-name{font:italic 800 clamp(1.8rem,2vw + 1rem,2.4rem)/1 var(--sans);color:var(--ink);letter-spacing:-.01em}
.ab-mi3-sign svg{width:100%;min-width:9rem;height:1.2rem;margin-top:.2rem;overflow:visible}
.ab-mi3-sign path{fill:none;stroke:var(--brand);stroke-width:3;stroke-linecap:round}
.ab-mi3-org{margin-top:1.8rem;padding-top:1.2rem;border-top:1px solid var(--rule)}
.ab-mi3-org a{color:var(--ink);text-decoration:underline;text-decoration-thickness:1px;font-weight:500;display:inline-block;padding-block:.5rem}
.ab-mi3-org a:hover{color:var(--brand)}
</style>
<script>
window.slotInit["mission"] = function(root, reduced){
  if (reduced) return;
  // the underline beneath her name is drawn once, like a signature
  gsap.fromTo(root.querySelector(".ab-mi3-sign path"), {drawSVG:"0%"}, {drawSVG:"100%", duration:1.1, ease:"power2.inOut", immediateRender:true,
    scrollTrigger:{trigger:root.querySelector(".ab-mi3-sign"), start:"top 88%", once:true}});
};
</script>
