<section class="s-chero-4">
  <div class="wrap s-chero-4__in">
    <figure class="s-chero-4__photo">
      <img src="../assets/drsan.jpg" width="980" height="1470" alt="Dr San, smiling, looking toward the camera">
    </figure>
    <p class="s-chero-4__name">Dr San · Psychosocial Retirement Educator</p>
    <h1 data-copy="hero.h" class="s-chero-4__h1">Ready to chat?</h1>
    <p data-copy="hero.lede" class="s-chero-4__lede">A free 30-minute chat about what your weeks might look like after work.</p>
    <a data-copy="hero.btn" class="btn s-chero-4__btn" href="#book">Find a time</a>
    <p class="s-chero-4__alt"><a data-copy="hero.alt" href="#message">Or send Dr San a message</a></p>
  </div>
</section>
<style>
.s-chero-4{padding-block:clamp(1.5rem,4vw,3.5rem) clamp(2.5rem,6vw,4.5rem);background:linear-gradient(to bottom,var(--ground-2),var(--ground))}
.s-chero-4__in{display:flex;flex-direction:column;align-items:center;text-align:center}
.s-chero-4__photo{margin:0 0 1.6rem;width:min(100%,520px);aspect-ratio:3/2;border-radius:1rem;overflow:hidden;background:var(--ground-3)}
.s-chero-4__photo img{width:100%;height:100%;object-fit:cover;object-position:50% 14%}
.s-chero-4__name{font:500 .95rem/1.4 var(--sans);color:var(--ink-soft);margin-bottom:.8rem}
.s-chero-4__h1{font:800 clamp(2.4rem,3vw + 1.4rem,4.6rem)/1.04 var(--sans);letter-spacing:-.022em;max-width:18ch;text-wrap:balance}
.s-chero-4__lede{margin-top:1rem;font-size:clamp(1.1rem,.5vw + 1rem,1.3rem);color:var(--ink-soft);max-width:38ch;text-wrap:balance}
.s-chero-4__btn{margin-top:1.8rem;min-height:48px}
.s-chero-4__alt{margin-top:1.1rem;font-size:1rem}
.s-chero-4__alt a{color:var(--ink);text-decoration-thickness:1px}
.s-chero-4__alt a:hover{color:var(--brand)}
</style>
<script>
window.slotInit["hero"] = function(root, reduced){
  if (reduced) return;
  gsap.fromTo(root.querySelector("img"), {scale:1.06, opacity:.001}, {scale:1, opacity:1, duration:1.4, ease:"power3.out", immediateRender:true});
};
</script>
