<section class="s-chero-3">
  <div class="wrap s-chero-3__in">
    <figure class="s-chero-3__photo">
      <img src="../assets/drsan.jpg" width="980" height="1470" alt="Dr San, smiling, looking toward the camera">
    </figure>
    <div class="s-chero-3__note">
      <h1 data-copy="hero.h" class="s-chero-3__h1">Ready to chat?</h1>
      <p data-copy="hero.lede" class="s-chero-3__lede">Hello, I’m Dr San. You don’t need anything worked out before we talk. A hunch that there’s more to plan than the money is plenty to start with.</p>
      <p class="s-chero-3__sign">Dr San <span>· Psychosocial Retirement Educator</span></p>
      <p class="s-chero-3__links">
        <a data-copy="hero.btn" class="btn" href="#book">Find a time</a>
        <a data-copy="hero.alt" class="s-chero-3__alt" href="#message">Or send me a message</a>
      </p>
    </div>
  </div>
</section>
<style>
.s-chero-3{padding-block:clamp(2rem,6vw,5rem);background:var(--ground)}
.s-chero-3__in{display:grid;gap:1.6rem;align-items:center}
.s-chero-3__photo{margin:0;width:clamp(120px,32vw,300px);aspect-ratio:4/5;border-radius:.9rem;overflow:hidden;background:var(--ground-2)}
.s-chero-3__photo img{width:100%;height:100%;object-fit:cover;object-position:50% 16%}
.s-chero-3__h1{font:800 clamp(2.3rem,2.4vw + 1.5rem,4rem)/1.05 var(--sans);letter-spacing:-.02em}
.s-chero-3__lede{margin-top:1.1rem;font-size:clamp(1.1rem,.5vw + 1rem,1.3rem);line-height:1.55;max-width:44ch;text-wrap:pretty}
.s-chero-3__sign{margin-top:1.2rem;font:italic 600 1.1rem/1.3 var(--sans);color:var(--brand-deep)}
.s-chero-3__sign span{font-style:normal;font-weight:500;font-size:.9rem;color:var(--ink-soft)}
.s-chero-3__links{margin-top:1.8rem;display:flex;flex-wrap:wrap;align-items:center;gap:1rem 1.6rem}
.s-chero-3__links .btn{min-height:48px}
.s-chero-3__alt{color:var(--ink);font-weight:600;text-decoration-thickness:1px}
.s-chero-3__alt:hover{color:var(--brand)}
@media(min-width:760px){
  .s-chero-3__in{grid-template-columns:auto 1fr;gap:clamp(2rem,5vw,4.5rem)}
}
</style>
<script>
window.slotInit["hero"] = function(root, reduced){
  if (reduced) return;
  gsap.fromTo(root.querySelector(".s-chero-3__photo"), {clipPath:"inset(100% 0 0 0)"}, {clipPath:"inset(0% 0 0 0)", duration:1.2, ease:"expo.out", immediateRender:true});
};
</script>
