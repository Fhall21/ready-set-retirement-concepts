<!DOCTYPE html>
<html lang="en-AU" data-pal="a">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact &mdash; Ready Set Retirement</title>
<meta name="description" content="Book a free 30-minute chat with Dr San, or send a message about workshops for your organisation.">
<script>window.RSR_ROOT = "../";</script>
<script>
(function(){try{
  var q=new URL(location.href).searchParams.get("pal");
  var p=(q||localStorage.getItem("rsr-pal")||"a").toLowerCase();
  if(p!=="b")p="a";
  document.documentElement.setAttribute("data-pal",p);
}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/site.css">
<style>
/* Contact page: base styles for the pieces every booking/form variant shares (calendar, times,
   fields, confirmation). Variants only change layout. Prefix: .cx-  See ../PAGE-CONTRACT.md. */
#book,#message,#details,#next{scroll-margin-top:1rem}
[data-step][hidden],[data-enquiry][hidden]{display:none!important}
::placeholder{color:color-mix(in srgb,var(--ink-soft) 80%,transparent)}
input,textarea,button,select{caret-color:var(--brand)}

/* ---- booking card ---- */
.cx-cal{border:1px solid var(--rule-strong);border-radius:.7rem;background:var(--ground);overflow:hidden}
.cx-cal-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.3rem 1rem;
  padding:1rem 1.3rem;border-bottom:2px solid var(--rule-strong);background:var(--ground-2)}
.cx-cal-title{font:700 1.08rem/1.3 var(--sans);color:var(--ink)}
.cx-cal-meta{font:500 .8rem/1.3 var(--num);color:var(--ink-soft);letter-spacing:.01em}
.cx-month{display:flex;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.8rem}
.cx-month [data-cal-title]{font:700 1.02rem/1.2 var(--sans)}
.cx-nav{display:flex;gap:.3rem}
.cx-nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--ground);color:var(--ink);
  cursor:pointer;display:grid;place-items:center;transition:background .15s,border-color .15s}
.cx-nav button:hover:not(:disabled){background:var(--ground-3);border-color:var(--rule-strong)}
.cx-nav button:disabled{opacity:.35;cursor:default}
.cx-nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.cx-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.25rem;text-align:center}
.cx-wd{font:700 .72rem/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft);padding:.4rem 0 .6rem}
.cx-day{position:relative;aspect-ratio:1;min-height:40px;width:100%;max-width:52px;justify-self:center;border-radius:50%;
  border:0;background:color-mix(in srgb,var(--brand) 9%,transparent);color:var(--brand-deep);
  font:700 .95rem/1 var(--num);font-variant-numeric:tabular-nums;cursor:pointer;
  transition:background .15s,color .15s,transform .15s var(--ease-out)}
.cx-day:hover:not(:disabled){background:color-mix(in srgb,var(--brand) 18%,transparent)}
.cx-day:disabled{background:none;color:color-mix(in srgb,var(--ink) 38%,transparent);font-weight:500;cursor:default}
.cx-day[aria-pressed="true"]{background:var(--brand);color:#fff}
.cx-day.is-today::after{content:"";position:absolute;left:50%;bottom:14%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}
.cx-day:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* strip: the next ten open weekdays, Mon–Fri columns */
.cx-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.45rem}
.cx-strip .cx-day{aspect-ratio:auto;max-width:none;border-radius:.6rem;padding:.65rem .2rem;display:grid;gap:.25rem;min-height:74px}
.cx-strip .cx-dw{font:600 .78rem/1 var(--sans)}
.cx-strip .cx-dn{font:700 1.25rem/1 var(--num)}
.cx-strip .cx-dm{font:500 .72rem/1 var(--sans)}
.cx-strip .cx-day:disabled{border:1px dashed var(--rule)}
.cx-strip .cx-day.is-today::after{display:none}

.cx-slots-label{font:700 1rem/1.3 var(--sans);color:var(--ink);margin-bottom:.8rem}
.cx-slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.2rem,1fr));gap:.5rem}
.cx-time{min-height:48px;border-radius:999px;border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);background:var(--ground);
  color:var(--brand-deep);font:700 .95rem/1 var(--num);font-variant-numeric:tabular-nums;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.cx-time:hover{background:var(--ground-3);border-color:var(--brand)}
.cx-time[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.cx-tz{margin-top:.9rem;font-size:.88rem;color:var(--ink-soft)}
.cx-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:52px;padding:.9rem 1.5rem;border-radius:999px;border:0;
  background:var(--brand);color:#fff;font:600 1rem/1 var(--sans);cursor:pointer;transition:background .2s,transform .2s var(--ease-out),opacity .2s}
.cx-btn:hover:not(:disabled){background:var(--brand-deep);transform:translateY(-1px)}
.cx-btn:disabled{background:color-mix(in srgb,var(--ink) 14%,transparent);color:var(--ink-soft);cursor:not-allowed}
.cx-quiet{background:none;border:0;padding:.6rem 0;font:600 .98rem/1.2 var(--sans);color:var(--ink);text-decoration:underline;
  text-decoration-thickness:1px;text-underline-offset:.2em;cursor:pointer}
.cx-quiet:hover{color:var(--brand)}
.cx-picked{display:flex;flex-wrap:wrap;gap:.3rem .8rem;align-items:baseline;padding:.9rem 1rem;border:1px solid var(--rule);
  border-radius:.5rem;background:var(--ground-2);margin-bottom:1.3rem}
.cx-picked strong{font-weight:700}
.cx-picked .cx-quiet{padding:0;font-size:.92rem}

/* ---- fields ---- */
.cx-fields{display:grid;gap:1.15rem}
.cx-field{display:grid;gap:.4rem}
.cx-field label,.cx-legend{font:600 1rem/1.3 var(--sans);color:var(--ink)}
.cx-opt{font-weight:400;color:var(--ink-soft)}
.cx-hint{font-size:.9rem;color:var(--ink-soft);margin:0}
.cx-field input,.cx-field textarea,.cx-field select{width:100%;min-height:52px;padding:.8rem .95rem;border:1px solid var(--rule-strong);border-radius:.5rem;
  background:var(--ground);color:var(--ink);font:400 1.05rem/1.4 var(--sans);transition:border-color .15s,box-shadow .15s}
.cx-field textarea{min-height:8.5rem;resize:vertical}
.cx-field input:hover,.cx-field textarea:hover{border-color:color-mix(in srgb,var(--ink) 40%,transparent)}
.cx-field input:focus,.cx-field textarea:focus,.cx-field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.cx-field [aria-invalid="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 4%,var(--ground))}
.cx-field [aria-invalid="true"]:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.cx-err{display:flex;align-items:center;gap:.45rem;margin:0;font:600 .92rem/1.35 var(--sans);color:var(--accent)}
.cx-err[hidden]{display:none}
.cx-err::before{content:"!";display:inline-flex;align-items:center;justify-content:center;width:1.1rem;height:1.1rem;flex:none;border-radius:50%;
  background:var(--accent);color:#fff;font:800 .72rem/1 var(--num)}
.cx-pair{display:grid;gap:1.15rem}
@media(min-width:640px){.cx-pair{grid-template-columns:1fr 1fr}}
[data-when][hidden]{display:none}

/* who-is-asking choice */
.cx-choice{border:0;margin:0;padding:0;display:grid;gap:.6rem}
.cx-choice-opts{display:grid;gap:.5rem}
@media(min-width:560px){.cx-choice-opts{grid-template-columns:1fr 1fr}}
.cx-choice label{position:relative;display:flex;gap:.75rem;align-items:flex-start;padding:.9rem 1rem;border:1px solid var(--rule-strong);border-radius:.6rem;
  cursor:pointer;font:500 1rem/1.35 var(--sans);background:var(--ground);transition:border-color .15s,background .15s}
.cx-choice label:hover{border-color:color-mix(in srgb,var(--brand) 55%,transparent)}
.cx-choice input{appearance:none;flex:none;width:1.25rem;height:1.25rem;margin:.05rem 0 0;border-radius:50%;border:2px solid var(--rule-strong);
  background:var(--ground);display:grid;place-items:center;transition:border-color .15s}
.cx-choice input::after{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--brand);transform:scale(0);transition:transform .15s var(--ease-out)}
.cx-choice input:checked{border-color:var(--brand)}
.cx-choice input:checked::after{transform:scale(1)}
.cx-choice input:focus-visible{outline:2px solid var(--brand);outline-offset:3px}
.cx-choice label:has(input:checked){border-color:var(--brand);background:color-mix(in srgb,var(--brand) 6%,var(--ground))}
.cx-choice small{display:block;margin-top:.15rem;font-size:.88rem;color:var(--ink-soft)}
.cx-choice strong{font-weight:700}

/* ---- confirmation ---- */
.cx-done{padding:clamp(1.4rem,3vw,2rem);border:1px solid var(--rule-strong);border-radius:.7rem;background:var(--ground-2)}
.cx-done[hidden]{display:none}
.cx-cal .cx-done{border:0;background:none;padding:0}
.cx-done:focus{outline:none}
.cx-done h3,.cx-done .cx-done-h{font:800 clamp(1.4rem,1rem + 1.4vw,1.9rem)/1.2 var(--sans);letter-spacing:-.01em;margin:0}
.cx-done h3:focus,.cx-done .cx-done-h:focus{outline:none}
.cx-done p{margin-top:.8rem;max-width:52ch}
.cx-done .cx-tick{width:44px;height:44px;border-radius:50%;background:var(--brand);display:grid;place-items:center;margin-bottom:1rem}
.cx-done .cx-tick svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cx-done .cx-quiet{margin-top:1rem}
</style>
</head>
<body>
<div id="site-nav"></div>

<main id="main">
  <div id="hello" data-slot="hero"></div>
  <!-- The booking slot's wrapper carries id="book" so ".../contact/#book" (used by every
       Book button site-wide) lands here regardless of which layout variant is mixed in. -->
  <div id="book" data-slot="booking"></div>
  <div id="details" data-slot="details"></div>
  <div id="message" data-slot="form"></div>
  <div id="next" data-slot="next"></div>
</main>

<footer class="site-foot" id="site-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/DrawSVGPlugin.min.js"></script>
<script src="contact.js"></script>
<script>
/* Slots load after the browser has already tried to jump to #book, so re-land on the hash once
   the first set of slots (and fonts) is in. */
document.addEventListener("vitals:change", function once(){
  document.removeEventListener("vitals:change", once);
  var id = location.hash.slice(1); if (!id) return;
  document.fonts.ready.then(function(){ requestAnimationFrame(function(){
    var el = document.getElementById(id); if (el) el.scrollIntoView({block:"start"});
  }); });
});
</script>
<script src="../shared/engine.js"></script>
</body>
</html>
